[package]
name = "path-demo"
version = "0.1.0"
edition = "2024"
description = "A command-line tool for remembering and quickly jumping to frequently used paths"
authors = ["王发"]
license = "MIT"
repository = "https://github.com/wf5440/path-demo"
readme = "README.md"
keywords = ["cli", "path", "navigation", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"